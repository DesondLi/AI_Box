[pytest]
; ============================================================================
; 微内核项目 - pytest 配置
; ============================================================================

; 测试发现
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; asyncio 支持
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

; 运行选项
addopts = -v --tb=short --strict-markers --cov=kernel --cov-report=term-missing --cov-fail-under=70 -p pytest_asyncio

; 覆盖率阈值：当前目标 70%，后续逐步提升到 80%+
; addopts = --cov-fail-under=80

; 自定义标记（后续扩展用）
markers =
    slow: 标记慢速测试
    integration: 集成测试标记
    unit: 单元测试标记


